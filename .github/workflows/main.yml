name: Build APK from Zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract Zip and Locate Project
        run: |
          mkdir -p extracted_project
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Found zip: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted_project
          
          # Find the directory containing gradlew
          PROJECT_ROOT=$(find extracted_project -name "gradlew" -exec dirname {} \; | head -n 1)
          echo "Found project root at: $PROJECT_ROOT"
          echo "PROJECT_PATH=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Build Debug APK
        run: |
          cd ${{ env.PROJECT_PATH }}
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Box-Blast-APK
          path: ${{ env.PROJECT_PATH }}/app/build/outputs/apk/debug/app-debug.apk
